      THESIS: studying is marking. This app is an examination paper being worked
      through, not a dashboard of progress cards; it refuses the ed-tech tile grid.
      OWN-WORLD: a manila desk pad carrying warm-white sheets; blue-black is the only
      ink for text, vermilion is only ever a mark; hairline booklet margin down every
      sheet; Literata for prose, Archivo caps for headings, Courier Prime for anything
      the invigilator typed.
      STORY: the reader sees an unfinished paper, reads a section, marks it, sits the
      questions, and is marked back with a reason.
      FIRST VIEWPORT: masthead rule across the desk; the syllabus sheet left, its four
      sections ruled and ticked in the margin; the invigilator's slip right with the
      count and the stamped BEGIN action.
      FORM: The Marked Paper; candidate 7 of the ordered grounded list; seed key 9e7031b8.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
